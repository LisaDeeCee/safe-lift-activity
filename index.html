<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Lifting Techniques Activity</title>
<style>
  :root {
    --primary: #1f2a52;
    --accent: #00bec7;
    --light: #d2f0f0;
    --neutral: #abb5bf;
  }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: var(--light);
    color: var(--primary);
  }

  .container {
    max-width: 900px;
    margin: auto;
  }

  h1 {
    text-align: center;
  }

  .card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .scenario img {
    width: 100%;
    border-radius: 10px;
  }

  .options button {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border: none;
    background: var(--primary);
    color: white;
    border-radius: 6px;
    cursor: pointer;
  }

  .options button:hover {
    background: var(--accent);
  }

  .feedback {
    margin-top: 15px;
    padding: 15px;
    border-radius: 6px;
    display: none;
  }

  .correct {
    background: #d4edda;
  }

  .incorrect {
    background: #f8d7da;
  }

  textarea {
    width: 100%;
    height: 100px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--neutral);
  }

  @media (max-width: 600px) {
    body { padding: 10px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Safe Lifting Techniques</h1>

  <div class="card scenario">
    <h2>Scenario</h2>
    <p>You need to lift a heavy box from the floor. What is the safest way to do it?</p>
    <img src="https://images.unsplash.com/photo-1581093588401-22f96b9b2c7f" alt="Person lifting box">
  </div>

  <div class="card">
    <h2>Choose the best option</h2>
    <div class="options">
      <button onclick="checkAnswer(false)">Bend at your back and lift quickly</button>
      <button onclick="checkAnswer(true)">Bend your knees, keep your back straight, and lift slowly</button>
      <button onclick="checkAnswer(false)">Twist your body while lifting to save time</button>
    </div>

    <div id="feedback" class="feedback"></div>
  </div>

  <div class="card">
    <h2>Apply to your workplace</h2>
    <p>Describe a lifting task in your job and how you could improve your technique.</p>
    <textarea placeholder="Write your response here..."></textarea>
  </div>
</div>

<script>
  function checkAnswer(isCorrect) {
    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';

    if (isCorrect) {
      feedback.className = 'feedback correct';
      feedback.innerHTML = '<strong>Correct.</strong> This technique protects your back and uses your leg muscles safely.';
    } else {
      feedback.className = 'feedback incorrect';
      feedback.innerHTML = '<strong>Not quite.</strong> This method increases risk of injury. Try again and focus on posture.';
    }
  }
</script>

</body>
</html>
